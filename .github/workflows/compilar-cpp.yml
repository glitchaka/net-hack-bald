name: NetHack original Windows grafico

on:
  push:
    branches: [main]
    paths:
      - CMakeLists.txt
      - scripts/compilar-nethack-original.ps1
      - scripts/instalar_y_compilar.ps1
      - upstream/nethack/sys/windows/vs/**
      - upstream/nethack/src/**
      - upstream/nethack/include/**
      - .github/workflows/compilar-cpp.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  compilar-net-hack-original:
    runs-on: windows-latest
    timeout-minutes: 45
    steps:
      - name: Descargar el codigo original
        uses: actions/checkout@v4
      - name: Configurar proyecto Windows
        run: cmake -S . -B build
      - name: Compilar el motor original y su interfaz grafica
        run: cmake --build build --config Release
      - name: Verificar ejecutable grafico y datos
        shell: pwsh
        run: |
          if (-not (Test-Path 'build/Release/NetHackW.exe')) {
            throw 'No se genero el NetHackW.exe original.'
          }
          if (-not (Get-ChildItem 'build/Release' -Filter 'nhdat*')) {
            throw 'No se empaquetaron los datos originales de NetHack.'
          }
          Write-Host 'OK: NetHackW.exe original y datos en Windows'
