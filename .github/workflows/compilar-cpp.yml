name: Verificar compilación y partida en Windows

on:
  push:
    branches: [main]
    paths:
      - CMakeLists.txt
      - include/nhb/**
      - src/multiplayer/**
      - tests/**
      - .github/workflows/compilar-cpp.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: Configurar CMake nativo
        run: cmake -S . -B build
      - name: Compilar Release
        run: cmake --build build --config Release --parallel 2
      - name: Verificar menú, servidor y seis personajes
        shell: pwsh
        run: |
          $exe = "build/Release/nethack-bald.exe"
          if (-not (Test-Path $exe)) { $exe = "build/nethack-bald.exe" }
          if (-not (Test-Path $exe)) { throw "No se generó nethack-bald.exe para Windows." }
          python tests/smoke_multiplayer.py $exe
