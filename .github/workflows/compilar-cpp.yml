name: Compilar C++ nativo Windows y Linux

on:
  push:
    branches: [main]
    paths:
      - CMakeLists.txt
      - include/nhb/**
      - src/multiplayer/**
      - .github/workflows/compilar-cpp.yml
      - tests/**
  workflow_dispatch:

permissions:
  contents: read

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: Configurar Windows
        run: cmake -S . -B build -DCMAKE_BUILD_TYPE=Release
      - name: Compilar
        run: cmake --build build --config Release --parallel 2
      - name: Comprobar menú, servidor, 2-6 personajes y rondas
        shell: pwsh
        run: |
          $exe = "build/Release/nethack-bald.exe"
          if (-not (Test-Path $exe)) { $exe = "build/nethack-bald.exe" }
          if (-not (Test-Path $exe)) { throw "No se ha generado el ejecutable Windows." }
          python tests/smoke_multiplayer.py $exe
  linux:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Configurar Linux
        run: cmake -S . -B build -DCMAKE_BUILD_TYPE=Release
      - name: Compilar
        run: cmake --build build --parallel 2
      - name: Comprobar menú, servidor, 2-6 personajes y rondas
        run: python3 tests/smoke_multiplayer.py build/nethack-bald
